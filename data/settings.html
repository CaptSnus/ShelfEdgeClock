<!DOCTYPE html>
<html lang="de">
	<head>
		<!-- META -->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<meta name="author" content="CaptSnus" />
		<!-- TITLE -->
		<title>Einstellungen - Shelf Edge Clock</title>
		<!-- HEADER STUFF -->
		<link rel="apple-touch-icon" sizes="180x180" href="./img/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="./img/favicon-16x16.png" />
		<link rel="manifest" href="./img/site.webmanifest" />
		<link rel="mask-icon" href="./img/safari-pinned-tab.svg" color="#212529" />
		<link rel="shortcut icon" href="./img/favicon.ico" />
		<meta name="apple-mobile-web-app-title" content="Shelf Clock" />
		<meta name="application-name" content="Shelf Clock" />
		<meta name="msapplication-TileColor" content="#00aba9" />
		<meta name="msapplication-config" content="/img/browserconfig.xml" />
		<meta name="theme-color" content="#ffffff" />
		<!-- CSS -->
		<link href="./css/bootstrap.css" rel="stylesheet" />
		<!-- JAVASCRIPT -->
		<script src="./js/bootstrap.js"></script>
		<script src="./js/jquery.js"></script>
		<script type="text/javascript" src="./js/sec_settings.js"></script>
		<script type="text/javascript">
			window.addEventListener("load", init, true);
			window.addEventListener("load", startup, false);
		</script>
	</head>

	<body>
		<div class="container">
			<!-- navigation -->
			<nav class="navbar fixed-top bg-body-tertiary navbar-expand-lg">
				<div class="container">
					<a class="navbar-brand" href="/">
						<img
							src="img/shelfclock.png"
							alt="Shelf Edge Clock"
							width="30"
							height="24"
							class="d-inline-block align-text-top"
						/>
						Shelf Edge Clock
					</a>
					<button
						class="navbar-toggler"
						type="button"
						data-bs-toggle="collapse"
						data-bs-target="#mainNavigation"
						aria-controls="mainNavigation"
						aria-expanded="false"
						aria-label="Menu ein-/ausblenden"
					>
						<span class="navbar-toggler-icon"></span>
					</button>
					<div class="collapse navbar-collapse" id="mainNavigation">
						<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
							<li class="nav-item">
								<a class="nav-link active" href="/settings">Einstellungen</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="/wifi">Netzwerk</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="/update">Aktualisierung</a>
							</li>
						</ul>
					</div>
				</div>
			</nav>

			<!-- main container -->
			<main style="padding-top: 56px; padding-bottom: 58px">
				<h1 class="my-4">Einstellungen</h1>
				<div class="accordion accordion-flush my-4" id="settings">
					<!-- global settings -->
					<div class="accordion-item">
						<h2 class="accordion-header" id="settingsGlobal">
							<button
								class="accordion-button collapsed"
								type="button"
								data-bs-toggle="collapse"
								data-bs-target="#collapseGlobal"
								aria-expanded="false"
								aria-controls="collapseGlobal"
							>
								Globale Einstellungen
							</button>
						</h2>
						<div
							id="collapseGlobal"
							class="accordion-collapse collapse"
							aria-labelledby="settingsGlobal"
							data-bs-parent="#settings"
						>
							<div class="accordion-body">
								<div class="form-floating mb-3">
									<select class="form-select" name="edgeBrightIn" id="edgeBrightIn">
										<option value="0">Automatik</option>
										<option value="25">10%</option>
										<option value="50">20%</option>
										<option value="75">30%</option>
										<option value="100">40%</option>
										<option value="125">50%</option>
										<option value="150">60%</option>
										<option value="175">70%</option>
										<option value="200">80%</option>
										<option value="225">90%</option>
										<option value="250">100%</option>
										<option selected>Wähle eine Option...</option>
									</select>
									<label for="edgeBrightIn" class="form-label">Helligkeit</label>
								</div>
								<div class="row g-3 mb-3" id="edgeBrightFields">
									<div class="col-md">
										<div class="form-floating">
											<input type="number" class="form-control" id="edgeBrightMin" min="0" max="255" value="0" />
											<label for="edgeBrightMin" class="form-label">min. Helligkeit</label>
										</div>
									</div>
									<div class="col-md">
										<div class="form-floating">
											<input type="number" class="form-control" id="edgeBrightMax" min="0" max="255" value="255" />
											<label for="edgeBrightMax" class="form-label">max. Helligkeit</label>
										</div>
									</div>
									<div class="col-md">
										<div class="form-floating">
											<input
												type="text"
												class="form-control"
												id="edgeBrightOut"
												min="0"
												max="255"
												value="255"
												readonly
											/>
											<label for="edgeBrightOut" class="form-label">effekt. Helligkeit</label>
										</div>
									</div>
								</div>
								<div class="form-floating mb-3">
									<select class="form-select" name="edgeFrequency" id="edgeFrequency">
										<option value="0">jede Sekunde</option>
										<option value="1">jede Minute</option>
										<option value="2">jede Stunde</option>
										<option value="3">jeden Tag</option>
										<option selected>Wähle eine Option...</option>
									</select>
									<label for="edgeFrequency" class="form-label">Farbwechsel</label>
								</div>
							</div>
						</div>
					</div>

					<!-- KNX -->
					<div class="accordion-item">
						<h2 class="accordion-header" id="settingsKNX">
							<button
								class="accordion-button collapsed"
								type="button"
								data-bs-toggle="collapse"
								data-bs-target="#collapseKNX"
								aria-expanded="false"
								aria-controls="collapseKNX"
							>
								Hausautomation
							</button>
						</h2>
						<div
							id="collapseKNX"
							class="accordion-collapse collapse"
							aria-labelledby="settingsKNX"
							data-bs-parent="#settings"
						>
							<div class="accordion-body">
								<div class="form-floating mb-3">
									<input type="text" class="form-control" id="knxAddress" value="192.168.xxx.yyy" />
									<label for="knxAddress" class="form-label">KNX - Adresse</label>
								</div>
								<div class="form-floating mb-3">
									<input type="text" class="form-control mb-2" id="knxPort" value="8080" />
									<label for="knxPort" class="form-label">KNX - Port</label>
								</div>
								<div class="form-floating mb-3">
									<input type="text" class="form-control" id="knxBrightPath" value="/rest/items/{itemname}/state" />
									<label for="knxBrightPath" class="form-label">KNX - Item: Helligkeit</label>
								</div>
								<div class="row g-3 mb-3">
									<div class="col-md">
										<div class="form-floating">
											<input type="number" class="form-control" id="knxBrightMin" min="0" value="0" />
											<label for="knxBrightMin" class="form-label">Helligkeit: Min-Wert</label>
										</div>
									</div>
									<div class="col-md">
										<div class="form-floating">
											<input type="number" class="form-control" id="knxBrightMax" min="0" value="150000" />
											<label for="knxBrightMax" class="form-label">Helligkeit: Max-Wert</label>
										</div>
									</div>
								</div>
								<div class="form-floating mb-3">
									<input type="text" class="form-control" id="knxTempPath" value="/rest/items/{itemname}/state" />
									<label for="knxTempPath" class="form-label">KNX - Item: Temperatur</label>
								</div>
								<div class="form-floating mb-3">
									<input type="text" class="form-control" id="knxHumidPath" value="/rest/items/{itemname}/state" />
									<label for="knxHumidPath" class="form-label">KNX - Item: Luftfeuchtigkeit</label>
								</div>
							</div>
						</div>
					</div>

					<!-- CLOCK -->
					<div class="accordion-item">
						<h2 class="accordion-header" id="settingsClock">
							<button
								class="accordion-button collapsed"
								type="button"
								data-bs-toggle="collapse"
								data-bs-target="#collapseClock"
								aria-expanded="false"
								aria-controls="collapseClock"
							>
								Modus - Uhrzeit
							</button>
						</h2>
						<div
							id="collapseClock"
							class="settings.accordion-collapse collapse"
							aria-labelledby="settingsClock"
							data-bs-parent="#settings"
						>
							<div class="accordion-body">
								<!-- NTP address -->
								<div class="form-floating mb-3">
									<input type="text" class="form-control" id="clkAddress" value="ch.pool.ntp.org" />
									<label for="clkAddress" class="form-label">NTP - Adresse</label>
								</div>
								<!-- NTP timezone -->
								<div class="form-floating mb-3">
									<input type="text" class="form-control" id="clkTimeZone" value="CET-1CEST,M3.5.0,M10.5.0/3" />
									<label for="clkTimeZone" class="form-label">NTP - Zeitzone</label>
								</div>
								<!-- Clock format -->
								<div class="form-floating mb-3">
									<select class="form-select" name="clkFormat" id="clkFormat">
										<option value="0">12 Stunden (AM/PM)</option>
										<option value="1">24 Stunden</option>
										<option selected>Wähle eine Option...</option>
									</select>
									<label for="clkFormat" class="form-label">Format</label>
								</div>
								<!-- Clock color -->
								<div class="form-floating mb-3">
									<select class="form-select" name="clkColor" id="clkColor">
										<option value="0">benutzerdefinierte Farben</option>
										<option value="1">zufällige Farben</option>
										<option selected>Wähle eine Option...</option>
									</select>
									<label for="clkColor" class="form-label">Farbmodus</label>
								</div>
								<!-- Clock color input -->
								<div id="clkColorInput" class="row g-3 mb-3">
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="clkColorH" />
												<label for="clkColorH">Stunden</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="clkColorM" />
												<label for="clkColorM">Minuten</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- DATE -->
					<div class="accordion-item">
						<h2 class="accordion-header" id="settingsDate">
							<button
								class="accordion-button collapsed"
								type="button"
								data-bs-toggle="collapse"
								data-bs-target="#collapseDate"
								aria-expanded="false"
								aria-controls="collapseDate"
							>
								Modus - Datum
							</button>
						</h2>
						<div
							id="collapseDate"
							class="accordion-collapse collapse"
							aria-labelledby="settingsDate"
							data-bs-parent="#settings"
						>
							<div class="accordion-body">
								<!-- Date format -->
								<div class="form-floating mb-3">
									<select class="form-select" name="datFormat" id="datFormat">
										<option value="0">0329 -> 29. März</option>
										<option value="1">2903 -> 29. März</option>
										<option selected>Wähle eine Option...</option>
									</select>
									<label for="datFormat" class="form-label">Format</label>
								</div>
								<!-- Date color -->
								<div class="form-floating mb-3">
									<select class="form-select" name="datColor" id="datColor">
										<option value="0">benutzerdefinierte Farben</option>
										<option value="1">zufällige Farben</option>
										<option selected>Wähle eine Option...</option>
									</select>
									<label for="datColor" class="form-label">Farbmodus</label>
								</div>
								<!-- Date color input-->
								<div id="datColorInput" class="row g-3 mb-3">
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="datColorD" />
												<label for="datColorD">Tag</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="datColorM" />
												<label for="datColorM">Monat</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- TEMPERATURE -->
					<div class="accordion-item">
						<h2 class="accordion-header" id="settingsTemperature">
							<button
								class="accordion-button collapsed"
								type="button"
								data-bs-toggle="collapse"
								data-bs-target="#collapseTemperature"
								aria-expanded="false"
								aria-controls="collapseTemperature"
							>
								Modus - Temperatur
							</button>
						</h2>
						<div
							id="collapseTemperature"
							class="accordion-collapse collapse"
							aria-labelledby="settingsTemperature"
							data-bs-parent="#settings"
						>
							<div class="accordion-body">
								<!-- Temperature symbol -->
								<div class="form-floating mb-3">
									<select class="form-select" name="temSymbol" id="temSymbol">
										<option value="0">Fahrenheit</option>
										<option value="1">Celsius</option>
										<option selected>Wähle eine Option...</option>
									</select>
									<label for="temSymbol" class="form-label">Symbol</label>
								</div>
							</div>
						</div>
					</div>

					<!-- HUMIDITY -->
					<div class="accordion-item">
						<h2 class="accordion-header" id="settingsHumidity">
							<button
								class="accordion-button collapsed"
								type="button"
								data-bs-toggle="collapse"
								data-bs-target="#collapseHumidity"
								aria-expanded="false"
								aria-controls="collapseHumidity"
							>
								Modus - Luftfeuchtigkeit
							</button>
						</h2>
						<div
							id="collapseHumidity"
							class="accordion-collapse collapse"
							aria-labelledby="settingsHumidity"
							data-bs-parent="#settings"
						>
							<div class="accordion-body">
								<!-- Humidity color -->
								<div class="form-floating mb-3">
									<select class="form-select" name="humColor" id="humColor">
										<option value="0">benutzerdefinierte Farben</option>
										<option value="1">zufällige Farben</option>
										<option selected>Wähle eine Option...</option>
									</select>
									<label for="humColor" class="form-label">Farbmodus</label>
								</div>
								<!-- Humidity color input -->
								<div id="humColorInput" class="row g-3 mb-3">
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="humColorA" />
												<label for="humColorA">Prozent</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="humColorB" />
												<label for="humColorB">Kommastelle</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="humColorC" />
												<label for="humColorC">Symbol</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- SCOREBOARD -->
					<div class="accordion-item">
						<h2 class="accordion-header" id="settingsScoreboard">
							<button
								class="accordion-button collapsed"
								type="button"
								data-bs-toggle="collapse"
								data-bs-target="#collapseScoreboard"
								aria-expanded="false"
								aria-controls="collapseScoreboard"
							>
								Modus - Anzeigetafel
							</button>
						</h2>
						<div
							id="collapseScoreboard"
							class="accordion-collapse collapse"
							aria-labelledby="settingsScoreboard"
							data-bs-parent="#settings"
						>
							<div class="accordion-body">
								<div class="row g-3 mb-3">
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="scoColorL" />
												<label for="scoColorL">linke Seite</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="scoColorR" />
												<label for="scoColorR">rechte Seite</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- COUNTDOWN -->
					<div class="accordion-item">
						<h2 class="accordion-header" id="settingsTimer">
							<button
								class="accordion-button collapsed"
								type="button"
								data-bs-toggle="collapse"
								data-bs-target="#collapseTimer"
								aria-expanded="false"
								aria-controls="collapseTimer"
							>
								Modus - Countdown
							</button>
						</h2>
						<div
							id="collapseTimer"
							class="accordion-collapse collapse"
							aria-labelledby="settingsTimer"
							data-bs-parent="#settings"
						>
							<div class="accordion-body">
								<div class="row g-3 mb-3">
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="couColorH" />
												<label for="couColorH">Stunden</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="couColorM" />
												<label for="couColorM">Minuten</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="couColorS" />
												<label for="couColorS">Sekunden</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
									<div class="col-md">
										<div class="input-group">
											<div class="form-floating">
												<input type="text" class="form-control" id="couColorA" />
												<label for="couColorA">Alarm</label>
											</div>
											<span class="input-group-text col-1"></span>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- SCROLL -->
					<div class="accordion-item">
						<h2 class="accordion-header" id="settingsScroll">
							<button
								class="accordion-button collapsed"
								type="button"
								data-bs-toggle="collapse"
								data-bs-target="#collapseScroll"
								aria-expanded="false"
								aria-controls="collapseScroll"
							>
								Modus - Wechselanzeige
							</button>
						</h2>
						<div
							id="collapseScroll"
							class="accordion-collapse collapse"
							aria-labelledby="settingsScroll"
							data-bs-parent="#settings"
						>
							<div class="accordion-body">
								<div class="form-floating mb-3">
									<input type="text" class="form-control" id="scrTime" />
									<label for="scrTime">Zeit bis zum Wechsel (in Sekunden)</label>
								</div>
							</div>
						</div>
					</div>

					<!-- DOWNLIGHTS -->
					<div class="accordion-item">
						<h2 class="accordion-header" id="settingsDown">
							<button
								class="accordion-button collapsed"
								type="button"
								data-bs-toggle="collapse"
								data-bs-target="#collapseDown"
								aria-expanded="false"
								aria-controls="collapseDown"
							>
								Downlights
							</button>
						</h2>
						<div
							id="collapseDown"
							class="accordion-collapse collapse"
							aria-labelledby="settingsDown"
							data-bs-parent="#settings"
						>
							<div class="accordion-body">
								<div class="form-floating mb-3">
									<select class="form-select" name="downSwitch" id="downSwitch">
										<option value="0">ausgeschaltet</option>
										<option value="1">eingeschaltet</option>
									</select>
									<label for="downSwitch" class="form-label">Downlights</label>
								</div>
								<div id="downFields">
									<div class="form-floating mb-3">
										<select class="form-select" name="downBrightIn" id="downBrightIn">
